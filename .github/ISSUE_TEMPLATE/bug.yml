name: Report a problem
description: Get help with MD Reader on macOS.
body:
  - type: markdown
    attributes:
      value: "This report is public. Remove private content, personal information and sensitive screenshots."
  - type: input
    id: version
    attributes:
      label: App and macOS versions
      placeholder: "MD Reader 1.2.0, macOS 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal Markdown example with private content removed
